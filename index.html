<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/pokeball.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      html { color-scheme: light dark; background: #f7f8fa; }
      body { margin: 0; }
      .app-boot { min-height: 100vh; display: grid; place-content: center; gap: 16px; color: #626c79; font: 600 14px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; text-align: center; }
      .app-boot-spinner { width: 42px; height: 42px; margin-inline: auto; border: 4px solid #e3e7ec; border-top-color: #c63e3e; border-radius: 50%; animation: app-boot-spin 800ms linear infinite; }
      @keyframes app-boot-spin { to { transform: rotate(1turn); } }
      @media (prefers-color-scheme: dark) {
        html { background: #15191e; }
        .app-boot { color: #abb5c2; }
        .app-boot-spinner { border-color: #353e49; border-top-color: #ffaaaa; }
      }
      @media (prefers-reduced-motion: reduce) {
        .app-boot-spinner { animation: none; }
      }
    </style>
    <title>Mon Pokédex</title>
  </head>
  <body>
    <div id="root">
      <div class="app-boot" role="status">
        <span class="app-boot-spinner" aria-hidden="true"></span>
        <span>Chargement du Pokédex...</span>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
